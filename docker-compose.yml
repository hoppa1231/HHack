services:
  postgres:
    image: ankane/pgvector:latest
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d

  database_migrations:
    build:
      context: .
      dockerfile: ./python_services/database_migrations/Dockerfile
    container_name: database_migrations
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  backend:
    build: ./back
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      database_migrations:
        condition: service_completed_successfully
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    networks:
      - default

  news_parser:
    build:
      context: .
      dockerfile: ./python_services/news_parser/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      database_migrations:
        condition: service_completed_successfully
    networks:
      - default

  news_categorizer:
    build:
      context: .
      dockerfile: ./python_services/news_categorizer/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      database_migrations:
        condition: service_completed_successfully
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
