<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News API — простой интерфейс</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --muted:#94a3b8; --accent:#22c55e; --danger:#ef4444; --border:#1f2937; }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,'Noto Sans',sans-serif;background:#0b1020;color:#e5e7eb}
    .wrap{max-width:980px;margin:0 auto;padding:24px}
    h1{font-size:22px;margin:0 0 16px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
    .grid{display:grid;gap:12px}
    .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
    input,select,button,textarea{font:inherit}
    input,select,textarea{background:#0b1328;border:1px solid #20304a;color:#e5e7eb;border-radius:10px;padding:10px 12px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:#335dff}
    button{background:#1f2937;border:1px solid #2b364a;color:#e5e7eb;border-radius:10px;padding:10px 14px;cursor:pointer}
    button.primary{background:#1a2f22;border-color:#1a3b27}
    button.primary:hover{background:#134e2a}
    button.danger{background:#3b1a1a;border-color:#582020}
    small.muted{color:var(--muted)}
    .status{margin-top:8px;font-size:12px}
    .status.ok{color:var(--accent)}
    .status.err{color:var(--danger)}
    .news-card{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
    .news-card img{width:120px;height:80px;object-fit:cover;border-radius:10px;border:1px solid #1f2b40;background:#0b1328}
    .news-card h3{margin:0 0 6px;font-size:16px}
    .summary{white-space:pre-wrap;line-height:1.45}
    .flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}
    .badge{border:1px solid #334155;color:#94a3b8;background:#0c1428;padding:2px 8px;border-radius:999px;font-size:12px}
    .hr{height:1px;background:#1f2937;margin:12px 0}
    @media (max-width:720px){ .grid.cols-2{grid-template-columns:1fr} .news-card{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap grid" style="gap:16px">
    <header class="flex-between">
      <h1>News API — демо‑интерфейс</h1>
      <span class="badge" id="tokenBadge">нет токена</span>
    </header>

    <!-- Настройки -->
    <section class="card grid cols-2">
      <div>
        <label for="apiBase">API BASE URL</label>
        <div class="row">
          <input id="apiBase" placeholder="http://localhost:5000/api" style="flex:1 1 auto;min-width:240px" />
          <button id="saveApi" class="primary">Сохранить</button>
        </div>
        <small class="muted">Меняем базовый адрес API при необходимости (например, через gateway).</small>
        <div class="status" id="apiStatus"></div>
      </div>
      <div>
        <label>Сессия</label>
        <div class="row">
          <button id="btnLogout" class="danger">Выйти</button>
          <button id="btnPing">Проверить соединение (логин не обязателен)</button>
        </div>
        <div class="status" id="pingStatus"></div>
      </div>
    </section>

    <!-- Авторизация -->
    <section class="card grid cols-2">
      <div>
        <h2 class="mb-8" style="font-size:18px">Регистрация</h2>
        <label>Имя</label>
        <input id="regName" placeholder="max" />
        <div class="mt-8"></div>
        <label>Пароль</label>
        <input id="regPassword" type="password" placeholder="••••••••" />
        <div class="mt-8"></div>
        <label>Предпочтения (через запятую)</label>
        <input id="regPrefs" placeholder="tech, finance" />
        <div class="mt-12 row">
          <button id="btnRegister" class="primary">Зарегистрироваться</button>
        </div>
        <div id="regStatus" class="status"></div>
      </div>
      <div>
        <h2 class="mb-8" style="font-size:18px">Вход</h2>
        <label>Имя</label>
        <input id="loginName" placeholder="max" />
        <div class="mt-12 row">
          <button id="btnLogin" class="primary">Войти</button>
        </div>
        <div id="loginStatus" class="status"></div>
      </div>
    </section>

    <!-- Новости -->
    <section class="card">
      <div class="flex-between">
        <h2 style="font-size:18px">Новости</h2>
        <div class="row">
          <input id="userId" type="number" min="1" value="1" title="user_id" style="width:100px" />
          <select id="period">
            <option value="day">day</option>
            <option value="week" selected>week</option>
            <option value="month">month</option>
          </select>
          <button id="btnLoadNews" class="primary">Загрузить</button>
        </div>
      </div>
      <div id="newsStatus" class="status"></div>
      <div id="newsList" class="grid mt-12"></div>
    </section>

    <!-- Сводка -->
    <section class="card" id="summaryCard" style="display:none">
      <div class="flex-between">
        <h2 style="font-size:18px">Сводка</h2>
        <button id="btnCloseSummary">Закрыть</button>
      </div>
      <div id="summaryStatus" class="status"></div>
      <h3 id="summaryHeader" class="mt-8" style="margin:0"></h3>
      <p id="summaryText" class="summary"></p>
    </section>
  </div>

<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const apiInput = $('#apiBase');
  const apiStatus = $('#apiStatus');
  const pingStatus = $('#pingStatus');
  const tokenBadge = $('#tokenBadge');
  const regStatus = $('#regStatus');
  const loginStatus = $('#loginStatus');
  const newsStatus = $('#newsStatus');
  const newsList = $('#newsList');
  const summaryCard = $('#summaryCard');
  const summaryHeader = $('#summaryHeader');
  const summaryText = $('#summaryText');
  const summaryStatus = $('#summaryStatus');

  const storage = {
    get base(){ return localStorage.getItem('api_base') || 'http://localhost:5000/api'; },
    set base(v){ localStorage.setItem('api_base', v); },
    get token(){ return localStorage.getItem('access_token'); },
    set token(v){ v ? localStorage.setItem('access_token', v) : localStorage.removeItem('access_token'); updateTokenBadge(); }
  }

  function updateTokenBadge(){
    const t = storage.token;
    if(!t){ tokenBadge.textContent = 'нет токена'; return; }
    tokenBadge.textContent = 'token · ' + t.slice(0, 12) + '…';
  }

  function setStatus(el, text, ok){
    el.textContent = text || '';
    el.className = 'status ' + (text ? (ok?'ok':'err') : '');
  }

  async function fetchJSON(path, body){
    const headers = { 'Content-Type':'application/json' };
    const t = storage.token;
    if(t) headers['Authorization'] = 'Bearer ' + t;
    const res = await fetch(storage.base + path, {
      method:'POST', headers, body: body ? JSON.stringify(body) : undefined
    });
    if(!res.ok){
      const txt = await res.text().catch(()=>res.statusText);
      throw new Error(`HTTP ${res.status} ${res.statusText}: ${txt}`);
    }
    return res.json();
  }

  // init
  apiInput.value = storage.base;
  updateTokenBadge();

  // actions
  $('#saveApi').addEventListener('click', ()=>{
    const url = apiInput.value.trim();
    try { new URL(url); } catch { setStatus(apiStatus, 'Некорректный URL', false); return; }
    storage.base = url; setStatus(apiStatus, 'Сохранено', true);
  });

  $('#btnPing').addEventListener('click', async()=>{
    setStatus(pingStatus, 'Пингую /health…');
    try {
      const res = await fetch(storage.base + '/health', { method:'GET' });
      setStatus(pingStatus, `Сервер отвечает: HTTP ${res.status}`, res.ok);
    } catch(e){ setStatus(pingStatus, String(e), false); }
  });

  $('#btnLogout').addEventListener('click', ()=>{ storage.token = ''; setStatus(loginStatus, 'Вы вышли', true); });

  $('#btnRegister').addEventListener('click', async()=>{
    const name = $('#regName').value.trim();
    const password = $('#regPassword').value;  // обязателен по схеме
    const prefs = $('#regPrefs').value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!name){ setStatus(regStatus, 'Введите имя', false); return; }
    if(!password){ setStatus(regStatus, 'Введите пароль', false); return; }
    setStatus(regStatus, 'Регистрирую…');
    try{
      const data = await fetchJSON('/register', { name, password, preferences: prefs });
      storage.token = data.access_token;
      setStatus(regStatus, 'Успех. Токен сохранён', true);
    }catch(e){ setStatus(regStatus, e.message, false); }
  });

  $('#btnLogin').addEventListener('click', async()=>{
    const name = $('#loginName').value.trim();
    if(!name){ setStatus(loginStatus, 'Введите имя', false); return; }
    setStatus(loginStatus, 'Вхожу…');
    try{
      const data = await fetchJSON('/login', { name });
      storage.token = data.access_token;
      setStatus(loginStatus, 'Успех. Токен сохранён', true);
    }catch(e){ setStatus(loginStatus, e.message, false); }
  });

  $('#btnLoadNews').addEventListener('click', async()=>{
    const user_id = parseInt($('#userId').value, 10) || 1;
    const news_period = $('#period').value;
    setStatus(newsStatus, 'Загружаю новости…');
    newsList.innerHTML = '';
    try{
      const data = await fetchJSON('/news', { user_id, news_period });
      const arr = Array.isArray(data.news) ? data.news : [];
      if(arr.length === 0){ setStatus(newsStatus, 'Пусто', true); return; }
      setStatus(newsStatus, `Найдено: ${arr.length}`, true);
      arr.forEach(renderNewsCard);
    }catch(e){ setStatus(newsStatus, e.message, false); }
  });

  $('#btnCloseSummary').addEventListener('click', ()=>{ summaryCard.style.display='none'; summaryHeader.textContent=''; summaryText.textContent=''; setStatus(summaryStatus,''); });

  function renderNewsCard(n){
    const el = document.createElement('div');
    el.className = 'news-card card';
    el.innerHTML = `
      ${n.img_url ? `<img src="${n.img_url}" alt="img">` : `<div style="width:120px;height:80px;border-radius:10px;background:#0b1328;border:1px solid #1f2b40"></div>`}
      <div>
        <h3>${escapeHtml(n.header || '')}</h3>
        <p style="margin:0 0 8px">${escapeHtml(n.mini_description || '')}</p>
        <button data-id="${n.news_id}" class="primary">Открыть сводку</button>
      </div>
    `;
    el.querySelector('button').addEventListener('click', ()=> openSummary(n.news_id));
    newsList.appendChild(el);
  }

  async function openSummary(news_id){
    setStatus(summaryStatus, 'Загружаю сводку…');
    summaryCard.style.display='block'; summaryHeader.textContent=''; summaryText.textContent='';
    try{
      const data = await fetchJSON('/summary', { news_id });
      summaryHeader.textContent = data.header || '';
      summaryText.textContent = data.summary || '';
      setStatus(summaryStatus, 'Готово', true);
      summaryCard.scrollIntoView({behavior:'smooth', block:'start'});
    }catch(e){ setStatus(summaryStatus, e.message, false); }
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
})();
</script>
</body>
</html>
