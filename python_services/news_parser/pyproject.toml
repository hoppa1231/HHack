[project]
name = "news_parser"
version = "0.1.0"
authors = [{ name = "Ildar Malikov", email = "ildar72malikov@gmail.com" }]
keywords = ["news", "parsing", "recommendations"]

requires-python = ">=3.13,<4.0"
dependencies = [
    "langchain-gigachat (>=0.3.11,<0.4.0)",
    "feedparser (>=6.0.12,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.13.5,<5.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "schedule (>=1.2.2,<2.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "markdownify (>=1.2.0,<2.0.0)",
    "duckduckgo-search (>=8.1.1,<9.0.0)",
    "langgraph (>=0.6.8,<0.7.0)",
]

[tool.poetry]
packages = [{ include = "news_parser", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
